name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
          python -m pip install --upgrade pip
          python -m pip install "cython<3.1" buildozer

      - name: Create config.py
        run: |
          echo 'SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"' > config.py
          echo 'SUPABASE_KEY = "${{ secrets.SUPABASE_KEY }}"' >> config.py

      - name: Build APK
        run: |
          java -version
          python --version
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: food-app-apk
          path: bin/*.apk