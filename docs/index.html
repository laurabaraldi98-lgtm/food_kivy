<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email confermata</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #b3ebe0;
            color: #05594a;
            font-family: Arial, sans-serif;
        }

        main {
            width: min(85%, 420px);
            padding: 40px 28px;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.88);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        h1 {
            margin-top: 0;
            font-size: 30px;
        }

        p {
            margin-bottom: 0;
            font-size: 18px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main>
        <h1>Email confermata!</h1>
        <p>
            Il tuo account è pronto.
            Ora puoi tornare all'app e accedere.
        </p>
    </main>
</body>

</html>
